server {
    listen ${PORT} default_server;
    server_name _;

    root /app/public;
    index index.php;
    charset utf-8;

    # Anexos de evento: limite da aplicação é 10 MB — folga para o overhead do multipart
    client_max_body_size 12M;

    # Logs para stdout/stderr (capturados pelo Railway)
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # Compressão dos assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Assets compilados pelo Vite — hash no nome permite cache longo
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Bloqueia acesso a arquivos ocultos (exceto .well-known)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
